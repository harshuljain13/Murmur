<?xml version="1.0" encoding="UTF-8"?>
<!-- Murmur logo: rounded tile on transparent background, for README and in-app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f29"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0dd"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="215" ry="215" fill="url(#tile)"/>
  <g transform="translate(512 512) scale(0.9) translate(-512 -512)">
    <path d="M224 744 L368 280 L512 584 L656 280 L800 744"
          fill="none" stroke="url(#mint)" stroke-width="76"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
