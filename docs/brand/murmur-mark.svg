<?xml version="1.0" encoding="UTF-8"?>
<!-- Murmur mark: a voice rippling outward in both directions. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g fill="none" stroke="#f6f6f9" stroke-linecap="round">
    <!-- inner ripple -->
    <g stroke-width="58" opacity="1">
      <path d="M612.4 400.5 A150 150 0 0 1 612.4 623.5"/>
      <path d="M411.6 400.5 A150 150 0 0 0 411.6 623.5"/>
    </g>
    <!-- middle ripple -->
    <g stroke-width="50" opacity="0.70">
      <path d="M679.3 326.2 A250 250 0 0 1 679.3 697.8"/>
      <path d="M344.7 326.2 A250 250 0 0 0 344.7 697.8"/>
    </g>
    <!-- outer ripple -->
    <g stroke-width="42" opacity="0.42">
      <path d="M746.2 251.9 A350 350 0 0 1 746.2 772.1"/>
      <path d="M277.8 251.9 A350 350 0 0 0 277.8 772.1"/>
    </g>
  </g>
  <!-- the voice itself -->
  <circle cx="512" cy="512" r="56" fill="#f6f6f9"/>
</svg>
