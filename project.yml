name: murmur-ios
options:
  bundleIdPrefix: app.murmur
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

schemes:
  Murmur:
    build:
      targets:
        MurmurApp: all
        MurmurKeyboard: all
    run:
      config: Debug
      targets:
        - MurmurApp
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ML63WLS943
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MurmurApp:
    type: application
    platform: iOS
    sources:
      - path: MurmurApp
      - path: MurmurShared
      - path: TranscribeCpp
    dependencies:
      - target: MurmurKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.app
        INFOPLIST_FILE: MurmurApp/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: TranscribeCpp/transcribe_bridge.h
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/build-ios
          - $(PROJECT_DIR)/build-llama-ios
        OTHER_LDFLAGS: -ltranscribe -lmurmurllm -lc++ -framework Accelerate -framework Metal -framework MetalKit -framework Foundation
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/TranscribeCpp/include
          - $(PROJECT_DIR)/LlamaLLM/include
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MurmurApp/MurmurApp.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.murmur.shared
    info:
      path: MurmurApp/Info.plist
      properties:
        CFBundleName: Murmur
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Murmur uses the microphone to transcribe your speech to text."
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - murmur
            CFBundleURLName: app.murmur.app
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: MurmurKeyboard
      - path: MurmurShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.app.keyboard
        INFOPLIST_FILE: MurmurKeyboard/Info.plist
    entitlements:
      path: MurmurKeyboard/MurmurKeyboard.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.murmur.shared
    info:
      path: MurmurKeyboard/Info.plist
      properties:
        CFBundleName: MurmurKeyboard
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
