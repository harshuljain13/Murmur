name: handy-ios
options:
  bundleIdPrefix: computer.handy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

schemes:
  Handy:
    build:
      targets:
        HandyApp: all
        HandyKeyboard: all
    run:
      config: Debug
      targets:
        - HandyApp
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HandyApp:
    type: application
    platform: iOS
    sources:
      - path: HandyApp
      - path: HandyShared
      - path: TranscribeCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.handy.app
        INFOPLIST_FILE: HandyApp/Info.plist
        APP_GROUP_IDENTIFIER: group.computer.handy
        SWIFT_OBJC_BRIDGING_HEADER: TranscribeCpp/transcribe_bridge.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build-ios
        OTHER_LDFLAGS: -ltranscribe
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/TranscribeCpp
    entitlements:
      path: HandyApp/HandyApp.entitlements
    info:
      path: HandyApp/Info.plist
      properties:
        CFBundleName: Handy
        CFBundleDisplayName: Handy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Handy uses the microphone to transcribe your speech to text."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - handy
            CFBundleURLName: computer.handy.app
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  HandyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: HandyKeyboard
      - path: HandyShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.handy.app.keyboard
        INFOPLIST_FILE: HandyKeyboard/Info.plist
        APP_GROUP_IDENTIFIER: group.computer.handy
    entitlements:
      path: HandyKeyboard/HandyKeyboard.entitlements
    info:
      path: HandyKeyboard/Info.plist
      properties:
        CFBundleName: HandyKeyboard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-input-mode
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    dependencies:
      - target: HandyApp
        embed: false
